<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="340" height="520"
     viewBox="0 0 340 520">
  <foreignObject width="100%" height="100%">
    <!-- everything inside here is rendered as HTML+CSS -->
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* ─── CARD STYLES ───────────────────────────────────────────── */
        .card {
          position: relative;
          width: 100%;  /* fills the 340px viewport width */
          max-width: 320px;
          margin: 0 auto;
          border-radius: 20px;
          border: 3px solid transparent;
          background-image:
            radial-gradient(ellipse at right top,
                            rgb(162, 52, 52) 0%, #1e1e1e 47%, #1e1e1e 100%),
            linear-gradient(45deg,
                            rgb(35, 34, 40) 0%, rgb(0,0,0) 50%, rgb(255, 53, 53) 100%);
          background-clip: padding-box, border-box;
          background-origin: padding-box, border-box;
          box-sizing: border-box;
        }
        .card .ds-top {
          width: 340px; height: 80px;
          margin-left: -10px;
          animation: dsTop 1.2s forwards;
        }
        .card .avatar-holder {
          position: absolute; top: 40px; left:50%;
          transform: translateX(-50%);
          width:100px; height:100px;
          border-radius:50%;
          background:#111; padding:5px;
          box-shadow:0 0 0 5px #1e1e1e, inset 0 0 0 3px #000;
          overflow:hidden;
          animation: mvTop 1s 0.3s forwards;
        }
        .card .avatar-holder img {
          width:100%; height:100%; object-fit:cover;
        }
        .card .name {
          text-align:center; padding-top:50px; z-index:100;
          animation: fadeIn 1s 0.6s forwards;
        }
        .card .name a {
          color:#fff; font-size:30px; font-weight:700; text-decoration:none;
        }
        .card .name h6 {
          margin-top:4px; font-size:12px; color:#bbb;
        }
        .card .button {
          text-align:center; margin:20px 0 0;
          animation: fadeIn 1s 0.8s forwards;
        }
        .card .button a {
          display:inline-block; padding:6px 18px;
          border:1px solid #fff; border-radius:20px;
          color:#fff; font-size:12px; text-decoration:none;
          transition: all .3s;
        }
        .card .button a:hover,
        .card .button a.following {
          background:#fff; color:#111;
        }
        .card .ds-info {
          display:flex; justify-content:space-around;
          margin:25px 0 0;
          animation: fadeInMove 1s 1s forwards;
        }
        .card .ds-info h6 {
          font-size:10px; color:#fff; text-transform:uppercase;
          margin-bottom:4px;
        }
        .card .ds-info p {
          color:#fff; font-size:14px; margin:0;
        }
        .card .ds-skill {
          padding:20px;
          animation: mvBottom 1s 1.2s forwards;
        }
        .card .ds-skill h6 {
          font-size:12px; color:#fff; text-transform:uppercase;
          margin-bottom:8px;
        }
        .card .ds-skill .skill {
          margin-bottom:10px;
        }
        .card .ds-skill .bar {
          height:6px; background:rgb(233,52,24);
          border-radius:10px; position:relative; overflow:hidden;
          transition: background .3s;
        }
        .card .ds-skill .bar:hover {
          background:#4A90E2;
        }
        .card .ds-skill .bar-html { width:95%; }
        .card .ds-skill .bar-css  { width:90%; }
        .card .ds-skill .bar-js   { width:80%; }

        /* ─── KEYFRAMES ─────────────────────────────────────────────── */
        @keyframes dsTop     { from { margin-top:-100px; } to { margin-top:0;} }
        @keyframes mvTop     { from { top:-150px;} to { top:40px;} }
        @keyframes mvBottom  { from { opacity:0; transform:translateY(50px);} to { opacity:1; transform:none;} }
        @keyframes fadeIn    { from { opacity:0;} to { opacity:1;} }
        @keyframes fadeInMove{ from { opacity:0; transform:translateX(-50px);} to { opacity:1; transform:none;} }
      </style>

      <!-- ─── YOUR CARD MARKUP ─────────────────────────────────────── -->
      <div class="card">
        <div class="ds-top"></div>
        <div class="avatar-holder">
          <img src="https://github.com/Joy-2612.png?size=512"
               alt="Joy’s Avatar"/>
        </div>
        <div class="name">
          <a href="https://github.com/Joy-2612" target="_blank">Joy</a>
          <h6>120 Followers</h6>
        </div>
        <div class="button">
          <a href="#" class="follow-btn">Follow</a>
        </div>
        <div class="ds-info">
          <div><h6>Repos</h6><p>42</p></div>
          <div><h6>Projects</h6><p>8</p></div>
          <div><h6>Stars</h6><p>230</p></div>
        </div>
        <div class="ds-skill">
          <h6>Skills</h6>
          <div class="skill">
            <h6>HTML5</h6><div class="bar bar-html"><p>95%</p></div>
          </div>
          <div class="skill">
            <h6>CSS3</h6><div class="bar bar-css"><p>90%</p></div>
          </div>
          <div class="skill">
            <h6>JavaScript</h6><div class="bar bar-js"><p>80%</p></div>
          </div>
        </div>
      </div>
      <!-- ────────────────────────────────────────────────────────────── -->
    </div>
  </foreignObject>
</svg>
